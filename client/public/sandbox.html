<!DOCTYPE html>
<!--
=============================================================================
FILE: client/public/sandbox.html
PURPOSE:Isolated execution environment for running user-submitted code
        safely. Supports both JavaScript (native eval) and Python (via
        Pyodide, a WebAssembly-compiled Python interpreter). Loaded inside
        a sandboxed iframe with no access to the parent page. Receives
        code and a target language via postMessage, executes accordingly,
        and reports captured output or errors back to the parent.
AUTHOR: Abraham Macias
DATE: 2026-08-19
DEPENDENCIES: Pyodide (loaded from CDN at runtime, only when Python execution is first requested)
EDGE CASES: Pyodide is loaded lazily and only once; subsequent Python runs
            reuse the already-initialized interpreter rather than reloading
            it. Errors from either language are caught and reported as
            output rather than crashing the sandbox.
=============================================================================
-->
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Sandbox</title>
</head>

<body>
    <script>
        const capturedLogs = [];

        console.log = (...args) => {
            const formattedLine = args
                .map((arg) => (typeof arg === 'object' ? JSON.stringify(arg) : String(arg)))
                .join(' ');
            capturedLogs.push(formattedLine);
        };

        // -------------------------------------------------------------------
        // STATE: pyodideInstance
        // WHAT: Holds the initialized Pyodide interpreter once loaded.
        // WHY IT EXISTS: Loading Pyodide is slow (a full interpreter download);
        //                caching the instance means it only happens once per
        //                page load, not on every Python execution.
        // -------------------------------------------------------------------
        let pyodideInstance = null;

        // -------------------------------------------------------------------
        // FUNCTION: getPyodide
        // WHAT: Returns the cached Pyodide instance, loading and initializing
        //       it on first use.
        // WHY IT EXISTS: Centralizes lazy-loading so Python execution code
        //                doesn't need to handle initialization itself.
        // -------------------------------------------------------------------
        async function getPyodide() {
            if (pyodideInstance) {
                return pyodideInstance;
            }

            window.parent.postMessage({ type: 'status', message: 'Loading Python runtime…' }, '*');

            const script = document.createElement('script');
            script.src = 'https://cdn.jsdelivr.net/pyodide/v0.26.1/full/pyodide.js';
            document.head.appendChild(script);

            await new Promise((resolve) => { script.onload = resolve; });

            pyodideInstance = await loadPyodide();

            pyodideInstance = await loadPyodide();
            pyodideInstance.setStdout({ batched: (text) => capturedLogs.push(text) });

            return pyodideInstance;
        }

        // -------------------------------------------------------------------
        // FUNCTION: runJavaScript
        // WHAT: Executes JavaScript code directly via eval.
        // -------------------------------------------------------------------
        function runJavaScript(code) {
            // eslint-disable-next-line no-eval
            eval(code);
        }

        // -------------------------------------------------------------------
        // FUNCTION: runPython
        // WHAT: Executes Python code using the Pyodide interpreter.
        // EDGE CASE: Loads Pyodide on demand if this is the first Python
        //            execution in this session.
        // -------------------------------------------------------------------
        async function runPython(code) {
            const pyodide = await getPyodide();
            await pyodide.runPythonAsync(code);
        }

        window.addEventListener('message', async (event) => {
            const { code, language } = event.data;
            if (!language) return;

            capturedLogs.length = 0;

            try {
                if (language === 'python') {
                    await runPython(code);
                } else {
                    runJavaScript(code);
                }
                window.parent.postMessage({ type: 'executionResult', output: capturedLogs.join('\n'), error: null }, '*');
            } catch (error) {
                window.parent.postMessage({ type: 'executionResult', output: capturedLogs.join('\n'), error: error.message }, '*');
            }
        });
    </script>
</body>

</html>
